server:
  port: 8083

spring:
  application:
    name: subscription-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/frauddb}
    username: ${DB_USERNAME:fraud}
    password: ${DB_PASSWORD:fraudpass}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false

subscription:
  trial-days: 7
  # HMAC key used to fingerprint card numbers. Override in every real environment.
  card-fingerprint-secret: ${CARD_FINGERPRINT_SECRET:dev-only-change-me}
  topics:
    trial-started: trial.started
    subscription-events: subscription.events
