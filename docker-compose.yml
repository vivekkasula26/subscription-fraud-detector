version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: fraud-postgres
    environment:
      POSTGRES_DB: frauddb
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraudpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d frauddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fraud-redis
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    container_name: fraud-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  kafka:
    image: apache/kafka:3.8.0
    container_name: fraud-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  gateway:
    build: ./gateway
    container_name: fraud-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - signup-service
      - subscription-service
      - scoring-service
      - case-service

  auth-service:
    build: ./services/auth-service
    container_name: fraud-auth
    ports:
      - "8081:8081"

  signup-service:
    build: ./services/signup-service
    container_name: fraud-signup
    ports:
      - "8082:8082"

  subscription-service:
    build: ./services/subscription-service
    container_name: fraud-subscription
    ports:
      - "8083:8083"

  scoring-service:
    build: ./services/scoring-service
    container_name: fraud-scoring
    ports:
      - "8084:8084"

  case-service:
    build: ./services/case-service
    container_name: fraud-case
    ports:
      - "8085:8085"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/frauddb
      SPRING_DATASOURCE_USERNAME: fraud
      SPRING_DATASOURCE_PASSWORD: fraudpass
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: fraud-frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway

volumes:
  postgres_data:
  mongo_data:
