server:
  port: 8080

spring:
  application:
    name: gateway

  cloud:
    gateway:
      routes:
        - id: auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: signups
          uri: http://localhost:8082
          predicates:
            - Path=/api/signups/**,/api/accounts/**
        - id: subscriptions
          uri: http://localhost:8083
          predicates:
            - Path=/api/subscriptions/**
        - id: scores
          uri: http://localhost:8084
          predicates:
            - Path=/api/scores/**,/api/rules/**
        - id: cases
          uri: http://localhost:8085
          predicates:
            - Path=/api/cases/**
